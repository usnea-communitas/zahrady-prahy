# Dependency updates once a month (package S-05 of the 2026–27 plan).
# Minor and patch updates arrive together in one pull request; a major
# update gets its own pull request so it can be read and tested alone.
# Updates are proposed only after a version has been public for a week.
#
# The static rebuild of the atlas (package Z-01) removes vinext, Nitro,
# Cloudflare, wrangler and the OpenAI Sites plugin, so Dependabot leaves
# them alone until then (their November group broke the build). The
# atlas runs on Node 22, so @types/node stays on 22, and TypeScript's next
# major is chosen in Z-01. oxlint 1.90 dropped a rule the lint config uses
# and adds one that flags app/page.tsx, which Z-01 reworks. Remove these
# ignores with Z-01.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: vinext
      - dependency-name: nitro
      - dependency-name: '@cloudflare/*'
      - dependency-name: wrangler
      - dependency-name: '@openai/sites-vite-plugin'
      - dependency-name: oxlint
      - dependency-name: oxlint-tsgolint
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

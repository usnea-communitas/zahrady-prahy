# Dependency updates once a month (package S-05 of the 2026–27 plan).
# Minor and patch updates arrive together in one pull request; a major
# update gets its own pull request so it can be read and tested alone.
# Updates are proposed only after a version has been public for a week.
#
# The atlas runs on Node 22, so @types/node stays on 22. oxlint 1.90
# dropped a rule the lint config uses and adds one that flags
# app/page.tsx, and TypeScript's next major needs its own look; both wait
# for a pull request of their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: oxlint
      - dependency-name: oxlint-tsgolint
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

# Dependency updates once a month (package S-05 of the 2026–27 plan).
# Minor and patch updates arrive together in one pull request; a major
# update gets its own pull request so it can be read and tested alone.
# Updates are proposed only after a version has been public for a week.
#
# The static rebuild of the atlas (package Z-01) removes vinext, Nitro,
# Cloudflare, wrangler and the OpenAI Sites plugin; until then, major
# updates of those can be closed with a note instead of merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

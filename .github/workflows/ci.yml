name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx oxfmt --check
      - run: npm test
      # The Vercel build output, the same as the live site. Nitro's provider
      # detection prefers GitHub Actions over VERCEL=1 and would emit a Node
      # server in .output/, so the preset is named explicitly.
      - run: npm run build:vercel
        env:
          VERCEL: '1'
          NITRO_PRESET: vercel
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
